<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regals 3D - Versió Escriptori</title>
    
    <!-- SCRIPT DE DETECCIÓ I REDIRECCIÓ A MÒBIL -->
    <script>
        (function() {
            var isMobile = /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                // Redirigeix a la versió mòbil si es detecta un dispositiu tàctil
                console.log("Mòbil detectat. Redirigint...");
                window.location.href = "mobil.html";
            }
        })();
    </script>
    
    <!-- Càrrega del CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Càrrega de Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #e0e6ed 0%, #f4f7fa 100%); }
        #scene-container { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1; cursor: pointer; }
        #navbar { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); height: 3rem; width: 10rem; background-color: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); z-index: 10; }
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 100; display: flex; align-items: center; justify-content: center; }
        #status-message { position: fixed; bottom: 1rem; right: 1rem; padding: 0.5rem 1rem; background-color: #ef4444; color: white; border-radius: 0.5rem; z-index: 50; display: none; transition: opacity 0.3s ease-in-out; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.8); z-index: 5; display: none; }
    </style>
</head>
<body>

    <div id="scene-container"></div>
    <div id="navbar"><span id="nav-text" class="text-white text-sm font-semibold">Regals 3D</span></div>
    <div id="crosshair"></div>
    <div id="status-message"></div>

    <div id="modal-overlay">
        <div id="modal-content" class="bg-white p-8 rounded-xl shadow-2xl max-w-lg mx-4 text-center">
            <h2 class="text-3xl font-bold mb-4 text-gray-800">Benvingut al Repàs 3D!</h2>
            <p class="mb-4 text-gray-600">Explora la sala en 3D. Mou-te amb **WASD** i mira amb el ratolí.</p>
            <p class="mb-6 text-sm text-gray-500">Prem **E** quan apuntis a un regal per veure detalls.</p>
            <button id="start-button" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 shadow-md">Començar (Pointer Lock)</button>
        </div>
    </div>

    <script>
        // --- CODI ORIGINAL DE LA VERSIÓ DESKTOP (INTEGRE) ---
        let scene, camera, renderer, container, controls;
        let isLocked = false;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const speed = 0.5;
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        let interactables = [];
        let playerVelocity = new THREE.Vector3();
        let playerDirection = new THREE.Vector3();
        const RADIUS = 11;

        const modal = document.getElementById('modal-overlay');
        const startButton = document.getElementById('start-button');
        const crosshair = document.getElementById('crosshair');
        const statusEl = document.getElementById('status-message');

        const dadesRegals = [
            { nom: "FUNDA NINTENDO", urlTextura: "https://m.media-amazon.com/images/I/81fu1Gei7VL._AC_SX342_SY445_QL70_ML2_.jpg", urlAmazon: "https://www.amazon.es/HEYSTOP-Accesorio-Transporte-Protector-Apretones/dp/B07MR496WN/", escala: 10.0, descripcio: "Funda de transport per a Nintendo Switch." },
            { nom: "JBL GO 4 NEGRO", urlTextura: "https://m.media-amazon.com/images/I/71HdLDJEEUL._AC_SY300_SX300_QL70_ML2_.jpg", urlAmazon: "https://www.amazon.es/JBL-inal%C3%A1mbrico-Bluetooth-resistente-reproducci%C3%B3n/dp/B0CX5C6WP3/", escala: 10.0, descripcio: "Altaveu portàtil JBL GO 4." },
            { nom: "ADAPTADOR JACK COTXE", urlTextura: "https://m.media-amazon.com/images/I/61ShlRX2ipL._AC_SX679_.jpg", urlAmazon: "https://www.amazon.es/YMOO-Transmisor-Transmisi%C3%B3n-Smartphone-Auriculares/dp/B0BBZZXQTL", escala: 10.0, descripcio: "Adaptador Bluetooth per a cotxes." },
            { nom: "BASE XBOX X", urlTextura: "https://m.media-amazon.com/images/I/61g+CesQPAL._AC_SX679_.jpg", urlAmazon: "https://www.amazon.es/vertical-ventilador-estaci%C3%B3n-recargables-auriculares/dp/B08VNNSNPB", escala: 10.0, descripcio: "Base de càrrega Xbox Series X/S." },
            { nom: "ADOPCIÓ GAT", urlTextura: "https://cdn.pixabay.com/photo/2023/06/29/12/28/cats-8096304_1280.jpg", urlAmazon: "https://ajuntament.barcelona.cat/benestaranimal/es/centro-de-acogida-de-animales-de-compania-caacb", escala: 10.0, descripcio: "Considera l'adopció!" },
            { nom: "SAMSUNG WATCH 8", urlTextura: "https://m.media-amazon.com/images/I/51iEor5RZLL._AC_SX679_.jpg", urlAmazon: "https://www.amazon.es/Samsung-Bluetooth-Smartwatch-Procesador-Seguimiento/dp/B0FCGDMRLL/", escala: 10.0, descripcio: "Samsung Galaxy Watch 8 LTE." }
        ];

        function showStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.style.backgroundColor = isError ? '#ef4444' : '#10b981';
            statusEl.style.display = 'block';
            statusEl.style.opacity = '1';
            setTimeout(() => { statusEl.style.opacity = '0'; setTimeout(() => statusEl.style.display = 'none', 300); }, 3000);
        }

        function init() {
            container = document.getElementById('scene-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf4f7fa);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 7.5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            crearSol();
            crearRegals();
            
            controls = new THREE.Object3D();
            controls.add(camera);
            scene.add(controls);

            setupEventListeners();
            animate();
        }
        
        function crearSol() {
            const gridSize = 40; const tileSide = 2;
            const colorA = new THREE.Color(0xdddddd); const colorB = new THREE.Color(0xbbbbbb);
            const geometry = new THREE.PlaneGeometry(tileSide, tileSide);
            for (let x = -gridSize / 2; x < gridSize / 2; x += tileSide) {
                for (let z = -gridSize / 2; z < gridSize / 2; z += tileSide) {
                    const isColorA = (x / tileSide + z / tileSide) % 2 === 0;
                    const material = new THREE.MeshStandardMaterial({ color: isColorA ? colorA : colorB, side: THREE.DoubleSide, metalness: 0.1, roughness: 0.8 });
                    const tile = new THREE.Mesh(geometry, material);
                    tile.rotation.x = Math.PI / 2;
                    tile.position.set(x + tileSide / 2, 0, z + tileSide / 2);
                    tile.receiveShadow = true;
                    scene.add(tile);
                }
            }
        }

        function crearRegals() {
            const loader = new THREE.TextureLoader();
            const numRegals = dadesRegals.length;
            const angleIncrement = (2 * Math.PI) / numRegals;
            dadesRegals.forEach((regal, index) => {
                const angle = index * angleIncrement;
                const x = Math.cos(angle) * RADIUS;
                const z = Math.sin(angle) * RADIUS;
                const geometry = new THREE.PlaneGeometry(regal.escala, regal.escala); 
                let material = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.1, roughness: 0.8, side: THREE.DoubleSide });
                loader.load(regal.urlTextura, (texture) => { material.map = texture; material.color.set(0xffffff); material.needsUpdate = true; });
                const objecte = new THREE.Mesh(geometry, material);
                objecte.position.set(x, regal.escala / 2 + 0.1, z);
                objecte.lookAt(new THREE.Vector3(0, objecte.position.y, 0));
                objecte.receiveShadow = true;
                objecte.userData = { nom: regal.nom, descripcio: regal.descripcio, urlAmazon: regal.urlAmazon, isInteractable: true };
                scene.add(objecte);
                interactables.push(objecte);
            });
        }

        function updateMovement(delta) {
            if (!isLocked) return;
            playerVelocity.x -= playerVelocity.x * 10.0 * delta;
            playerVelocity.z -= playerVelocity.z * 10.0 * delta;
            playerDirection.z = Number(moveForward) - Number(moveBackward);
            playerDirection.x = Number(moveRight) - Number(moveLeft);
            playerDirection.normalize();
            if (moveForward || moveBackward) playerVelocity.z -= playerDirection.z * speed * 60.0 * delta;
            if (moveRight || moveLeft) playerVelocity.x -= playerDirection.x * speed * 60.0 * delta;
            controls.translateX(playerVelocity.x * delta);
            controls.translateZ(playerVelocity.z * delta);
            controls.position.y = 1.7; 
        }

        function checkInteractions() {
            if (!isLocked) return;
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            const intersects = raycaster.intersectObjects(interactables);
            let itemHovered = false;
            interactables.forEach(obj => { if(obj.material) obj.material.emissive.setHex(0x000000); });
            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.isInteractable && object.material) {
                    object.material.emissive.setHex(0xaaaaaa);
                    object.material.emissiveIntensity = 0.5;
                    document.getElementById('nav-text').textContent = `[E] Veure ${object.userData.nom}`;
                    itemHovered = true;
                }
            }
            if (!itemHovered) document.getElementById('nav-text').textContent = 'Regals 3D';
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            updateMovement(delta);
            checkInteractions();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        function onPointerlockChange() {
            if (document.pointerLockElement === container) {
                isLocked = true; modal.style.display = 'none'; crosshair.style.display = 'block';
            } else {
                isLocked = false; 
                if (document.getElementById('modal-content').querySelector('#start-button')) modal.style.display = 'flex';
                crosshair.style.display = 'none';
            }
        }

        function onModalClick(e) { if (e.target.id === 'modal-overlay') e.stopPropagation(); }
        function onKeyDown(event) {
            if (!isLocked) return;
            switch (event.key.toUpperCase()) { case 'W': moveForward = true; break; case 'S': moveBackward = true; break; case 'A': moveLeft = true; break; case 'D': moveRight = true; break; case 'E': handleInteractionClick(); break; }
        }
        function onKeyUp(event) {
            if (!isLocked) return;
            switch (event.key.toUpperCase()) { case 'W': moveForward = false; break; case 'S': moveBackward = false; break; case 'A': moveLeft = false; break; case 'D': moveRight = false; break; }
        }
        function onMouseMove(event) {
            if (!isLocked) return;
            controls.rotation.y -= event.movementX * 0.002;
            camera.rotation.x += event.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        }
        function onResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

        function handleInteractionClick() {
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            const intersects = raycaster.intersectObjects(interactables);
            if (intersects.length > 0) {
                const object = intersects[0].object;
                if (object.userData.isInteractable) {
                    document.exitPointerLock();
                    const modalContentEl = document.getElementById('modal-content');
                    modalContentEl.innerHTML = `
                        <h2 class="text-3xl font-bold mb-4 text-gray-800">${object.userData.nom}</h2>
                        <p class="mb-6 text-gray-600">${object.userData.descripcio}</p>
                        ${object.userData.urlAmazon ? `<a href="${object.userData.urlAmazon}" target="_blank" class="inline-block bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 shadow-md mb-4 mr-2">Veure a Amazon</a>` : ''}
                        <button onclick="hideInfoModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 shadow-md">Tornar</button>
                    `;
                    modalContentEl.style.display = 'block';
                    modal.style.display = 'flex';
                }
            }
        }

        window.hideInfoModal = function() {
            modal.style.display = 'none';
            document.getElementById('modal-content').innerHTML = `
                <h2 class="text-3xl font-bold mb-4 text-gray-800">Benvingut al Repàs 3D!</h2>
                <p class="mb-4 text-gray-600">Explora la sala en 3D...</p>
                <button id="start-button" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 shadow-md">Començar (Pointer Lock)</button>
            `;
            document.getElementById('start-button').addEventListener('click', () => container.requestPointerLock());
        }

        function setupEventListeners() {
            startButton.addEventListener('click', () => container.requestPointerLock());
            container.addEventListener('click', () => { if (!isLocked && modal.style.display !== 'flex') container.requestPointerLock(); });
            document.addEventListener('pointerlockchange', onPointerlockChange, false);
            modal.addEventListener('click', onModalClick);
            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('keydown', onKeyDown, false);
            document.addEventListener('keyup', onKeyUp, false);
            window.addEventListener('resize', onResize, false);
        }

        window.onload = init;
    </script>
</body>
</html>
